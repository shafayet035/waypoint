# Waypoint project file. `wp check` validates everything in this folder.
name = "red_canyon"
version = "0.1.0"
start_scene = "scenes/canyon.scene.ron"

[quality]
# low, mid or flagship: render resolution cap (540/720/900 lines, upscaled),
# traffic and pedestrian counts, rain density. `wp run --quality low` overrides.
tier = "mid"
# The player measures each device on first launch (`wp bench` shows how) and
# picks low, mid or flagship itself, saved in its settings.toml. Set false to
# always use `tier`. `wp run` uses `tier` unless given --quality auto.
auto = true

[plugins]
# Switch engine plugins off by name, e.g. disabled = ["vehicle"].
disabled = []

[look]
# Stylised: soft warm light, cool shade, deep haze, bloom, distant blur.
style = "stylised"
ground = [226, 150, 108]
asphalt = [196, 128, 92]
markings = [214, 146, 108]
sky_top = [150, 190, 228]
sky_horizon = [246, 214, 190]
