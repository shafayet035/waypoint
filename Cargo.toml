[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
toml = "1"
schemars = "1"
clap = { version = "4", features = ["derive"] }
wgpu = "30"
winit = { version = "0.30", features = ["android-native-activity"] }
pollster = "1"
png = "0.18"
quick-xml = "0.42"
mlua = { version = "0.11", features = ["luau", "vendored"] }
bytemuck = { version = "1", features = ["derive"] }

wp_core = { path = "crates/wp_core" }
wp_ecs = { path = "crates/wp_ecs" }
wp_app = { path = "crates/wp_app" }
wp_data = { path = "crates/wp_data" }
wp_physics = { path = "crates/wp_physics" }
wp_vehicle = { path = "crates/wp_vehicle" }
wp_world = { path = "crates/wp_world" }
wp_traffic = { path = "crates/wp_traffic" }
wp_mission = { path = "crates/wp_mission" }
wp_script = { path = "crates/wp_script" }
wp_asset = { path = "crates/wp_asset" }
wp_road = { path = "crates/wp_road" }
wp_test = { path = "crates/wp_test" }
waypoint = { path = "crates/waypoint" }
wp_rhi = { path = "crates/wp_rhi" }
wp_render = { path = "crates/wp_render" }
wp_platform = { path = "crates/wp_platform" }
wp_control = { path = "crates/wp_control" }
wp_player = { path = "crates/wp_player" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# Validation uses `!(x > 0.0)` on purpose: it also rejects NaN.
neg_cmp_op_on_partial_ord = "allow"
# Diagnostics are returned by value; they are rare and carry rich context.
result_large_err = "allow"
