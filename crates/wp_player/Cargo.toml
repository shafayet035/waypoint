[package]
name = "wp_player"
description = "The game player: runs a Waypoint project in a window. This is the app shipped to iOS and Android."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wp_player"
# cdylib: Android loads the game as libwp_player.so (see tools/android/build.sh).
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "waypoint-player"
path = "src/main.rs"

[dependencies]
waypoint.workspace = true
wp_control.workspace = true
wp_platform.workspace = true
wp_render.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit.workspace = true

[lints]
workspace = true
